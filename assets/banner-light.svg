<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Aditia Rafif, Product Manager. I decide the rules, then ship them.">
  <style>
    .bg { fill: #f4f1ea; }
    .ink { fill: #1c1b18; }
    .muted { fill: #5f5a50; }
    .accent { fill: #b5432a; }
    .line { stroke: #cfc8b8; }
    .node { fill: #fffdf8; stroke: #1c1b18; }
    .node-hot { fill: #b5432a; stroke: #b5432a; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .flow { stroke: #b5432a; stroke-width: 2; stroke-dasharray: 6 8; fill: none; animation: dash 1.6s linear infinite; }
    .pulse { animation: pulse 4.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .p2 { animation-delay: 1.2s; } .p3 { animation-delay: 2.4s; } .p4 { animation-delay: 3.6s; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    @keyframes pulse { 0%, 70%, 100% { fill: #fffdf8; } 10%, 25% { fill: #f2d3c8; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse, .cursor { animation: none; } }
  </style>

  <rect class="bg" width="1200" height="340" rx="18"/>
  <line class="line" x1="56" y1="262" x2="1144" y2="262" stroke-width="1"/>

  <text x="56" y="76" class="mono accent" font-size="15" letter-spacing="2.5">PRODUCT MANAGER · 6+ YEARS · BANDUNG, INDONESIA</text>
  <text x="54" y="150" class="serif ink" font-size="68" font-weight="700">Aditia Rafif</text>
  <text x="56" y="200" class="sans ink" font-size="24">I decide the rules. Then I ship them<tspan class="accent">.</tspan><tspan class="accent cursor"> ▍</tspan></text>
  <text x="56" y="232" class="sans muted" font-size="17">Fintech lending · Province-scale public platforms · Operations tools · Prototypes built with AI agents</text>

  <!-- how I work: rule → spec → build → check -->
  <g class="sans" font-size="14">
    <path class="flow" d="M 708 120 L 1092 120"/>
    <g>
      <circle class="node pulse" cx="708" cy="120" r="9" stroke-width="2"/>
      <text x="708" y="92" class="ink" text-anchor="middle" font-weight="600">Rule</text>
      <text x="708" y="152" class="muted" text-anchor="middle" font-size="12.5">who gets a loan,</text>
      <text x="708" y="168" class="muted" text-anchor="middle" font-size="12.5">who gets a seat</text>
    </g>
    <g>
      <circle class="node pulse p2" cx="836" cy="120" r="9" stroke-width="2"/>
      <text x="836" y="92" class="ink" text-anchor="middle" font-weight="600">Spec</text>
      <text x="836" y="152" class="muted" text-anchor="middle" font-size="12.5">PRD engineers</text>
      <text x="836" y="168" class="muted" text-anchor="middle" font-size="12.5">can build from</text>
    </g>
    <g>
      <circle class="node pulse p3" cx="964" cy="120" r="9" stroke-width="2"/>
      <text x="964" y="92" class="ink" text-anchor="middle" font-weight="600">Ship</text>
      <text x="964" y="152" class="muted" text-anchor="middle" font-size="12.5">with the team,</text>
      <text x="964" y="168" class="muted" text-anchor="middle" font-size="12.5">or an AI agent</text>
    </g>
    <g>
      <circle class="node-hot" cx="1092" cy="120" r="9"/>
      <text x="1092" y="92" class="accent" text-anchor="middle" font-weight="600">Check</text>
      <text x="1092" y="152" class="muted" text-anchor="middle" font-size="12.5">with my own SQL,</text>
      <text x="1092" y="168" class="muted" text-anchor="middle" font-size="12.5">not a hunch</text>
    </g>
  </g>

  <g class="mono" font-size="13" letter-spacing="0.5">
    <text x="56" y="300" class="ink">900K+ <tspan class="muted">applicants served</tspan></text>
    <text x="330" y="300" class="ink">10K+ <tspan class="muted">lending customers</tspan></text>
    <text x="600" y="300" class="ink">55→22 <tspan class="muted">days credit SLA</tspan></text>
    <text x="860" y="300" class="ink">IDR 180B <tspan class="muted">loan book added</tspan></text>
  </g>
</svg>
