<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Aditia Rafif, Product Manager. I decide the rules, ship them, and stay until they work: roll out, observe behaviour, measure and fix.">
  <style>
    .bg { fill: #14130f; }
    .ink { fill: #ede8dc; }
    .muted { fill: #a8a294; }
    .accent { fill: #e8805f; }
    .line { stroke: #34312a; }
    .bracket { stroke: #6b665a; fill: none; }
    .bracket-hot { stroke: #e8805f; fill: none; }
    .node { fill: #14130f; stroke: #ede8dc; }
    .node-hot { fill: #e8805f; stroke: #e8805f; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .flow-build { stroke: #6b665a; stroke-width: 2; stroke-dasharray: 6 8; fill: none; animation: dash 1.6s linear infinite; }
    .flow-work { stroke: #e8805f; stroke-width: 3; stroke-dasharray: 14 6; fill: none; animation: dash 1.2s linear infinite; }
    .halo { fill: #e8805f; opacity: 0; animation: halo 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .h2 { animation-delay: 1.2s; } .h3 { animation-delay: 2.4s; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes dash { to { stroke-dashoffset: -40; } }
    @keyframes halo { 0% { opacity: .35; transform: scale(1); } 60%, 100% { opacity: 0; transform: scale(2.4); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow-build, .flow-work, .halo, .cursor { animation: none; } }
  </style>

  <rect class="bg" width="1200" height="460" rx="18"/>

  <!-- identity -->
  <text x="56" y="72" class="mono accent" font-size="15" letter-spacing="2.5">PRODUCT MANAGER · 6+ YEARS · BANDUNG, INDONESIA</text>
  <text x="54" y="142" class="serif ink" font-size="66" font-weight="700">Aditia Rafif</text>
  <text x="56" y="188" class="sans ink" font-size="24">I decide the rules, ship them, and stay <tspan class="accent" font-weight="700">until they actually work</tspan><tspan class="accent">.</tspan><tspan class="accent cursor"> ▍</tspan></text>
  <text x="56" y="218" class="sans muted" font-size="17">Fintech lending · Province-scale public platforms · Operations tools · Prototypes built with AI agents</text>

  <!-- phase brackets -->
  <g class="mono" font-size="13" letter-spacing="2">
    <path class="bracket" d="M 96 270 L 96 262 L 516 262 L 516 270" stroke-width="1.5"/>
    <text x="306" y="252" class="muted" text-anchor="middle">BUILD IT</text>
    <path class="bracket-hot" d="M 684 270 L 684 262 L 1104 262 L 1104 270" stroke-width="2"/>
    <text x="894" y="252" class="accent" text-anchor="middle" font-weight="700">MAKE IT WORK</text>
  </g>

  <!-- flow -->
  <path class="flow-build" d="M 110 324 L 698 324"/>
  <path class="flow-work" d="M 698 324 L 1090 324"/>

  <g class="sans">
    <!-- build -->
    <circle class="node" cx="110" cy="324" r="9" stroke-width="2"/>
    <text x="110" y="300" class="ink" text-anchor="middle" font-size="16" font-weight="600">Rule</text>
    <text x="110" y="354" class="muted" text-anchor="middle" font-size="13">who gets a loan,</text>
    <text x="110" y="371" class="muted" text-anchor="middle" font-size="13">who gets a seat</text>

    <circle class="node" cx="306" cy="324" r="9" stroke-width="2"/>
    <text x="306" y="300" class="ink" text-anchor="middle" font-size="16" font-weight="600">Spec</text>
    <text x="306" y="354" class="muted" text-anchor="middle" font-size="13">a PRD engineers</text>
    <text x="306" y="371" class="muted" text-anchor="middle" font-size="13">can build from</text>

    <circle class="node" cx="502" cy="324" r="9" stroke-width="2"/>
    <text x="502" y="300" class="ink" text-anchor="middle" font-size="16" font-weight="600">Ship</text>
    <text x="502" y="354" class="muted" text-anchor="middle" font-size="13">with the team,</text>
    <text x="502" y="371" class="muted" text-anchor="middle" font-size="13">or an AI agent</text>

    <!-- make it work -->
    <circle class="halo" cx="698" cy="324" r="11"/>
    <circle class="node-hot" cx="698" cy="324" r="11"/>
    <text x="698" y="300" class="accent" text-anchor="middle" font-size="16" font-weight="700">Roll out</text>
    <text x="698" y="354" class="ink" text-anchor="middle" font-size="13">train the users,</text>
    <text x="698" y="371" class="ink" text-anchor="middle" font-size="13">write the SOP</text>

    <circle class="halo h2" cx="894" cy="324" r="11"/>
    <circle class="node-hot" cx="894" cy="324" r="11"/>
    <text x="894" y="300" class="accent" text-anchor="middle" font-size="16" font-weight="700">Observe</text>
    <text x="894" y="354" class="ink" text-anchor="middle" font-size="13">how people really use it,</text>
    <text x="894" y="371" class="ink" text-anchor="middle" font-size="13">in the field and in the data</text>

    <circle class="halo h3" cx="1090" cy="324" r="11"/>
    <circle class="node-hot" cx="1090" cy="324" r="11"/>
    <text x="1090" y="300" class="accent" text-anchor="middle" font-size="16" font-weight="700">Measure &amp; fix</text>
    <text x="1090" y="354" class="ink" text-anchor="middle" font-size="13">find the root cause,</text>
    <text x="1090" y="371" class="ink" text-anchor="middle" font-size="13">fix, measure again ↺</text>
  </g>

  <!-- outcomes, not outputs -->
  <line class="line" x1="56" y1="400" x2="1144" y2="400" stroke-width="1"/>
  <g class="mono" font-size="13" letter-spacing="0.3">
    <text x="56" y="432" class="ink">900K+ <tspan class="muted">applicants served</tspan></text>
    <text x="283" y="432" class="ink">10K+ <tspan class="muted">lending customers</tspan></text>
    <text x="503" y="432" class="ink">55→22 <tspan class="muted">days credit SLA</tspan></text>
    <text x="715" y="432" class="ink">100%→3% <tspan class="muted">unresolved orders</tspan></text>
    <text x="957" y="432" class="ink">40%→17% <tspan class="muted">over-limit orders</tspan></text>
  </g>
</svg>
